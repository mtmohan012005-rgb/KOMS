services:
  - type: web
    name: koms-backend
    runtime: docker
    repo: https://github.com/REPLACE_WITH_YOUR_USERNAME/koms-backend.git
    branch: main
    region: singapore
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: koms_db
      - key: DB_PORT
        value: "3306"
      - key: PORT
        value: "10000"
