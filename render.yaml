services:
  - type: web
    name: koms-backend
    runtime: docker
    repo: https://github.com/mtmohan012005-rgb/KOMS.git
    branch: main
    region: singapore
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/index.php
    envVars:
      - key: DB_HOST
        value: mysql-3f01fdf9-mtmohan012005-1250.h.aivencloud.com
      - key: DB_USER
        value: avnadmin
      - key: DB_NAME
        value: koms
      - key: DB_PORT
        value: "15346"
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://koms-backend.onrender.com
